<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Records</title>

    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --success: #16a34a;
            --success-dark: #15803d;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
            --light: #f8fafc;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 50, 0.1);
        }

        /* -------- Buttons -------- */
        .btn {
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            color: #fff;
            transition: 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
        }

        .btn-primary:hover {
            background: var(--secondary);
        }

        .btn-success {
            background: var(--success);
        }

        .btn-success:hover {
            background: var(--success-dark);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-dark);
        }

        /* -------- Table -------- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
            color: #334155;
        }

        th {
            background: #f1f5f9;
            font-weight: 600;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* -------- Modal -------- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(3px);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .modal-content {
            background: white;
            margin: 8% auto;
            padding: 25px;
            width: 360px;
            border-radius: 12px;
            box-shadow: 0 15px 25px rgba(0, 0, 40, 0.2);
            animation: popup 0.25s ease-in-out;
        }

        @keyframes popup {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h3 {
            margin: 0 0 15px;
            color: #1e293b;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
        }

        .modal-actions {
            text-align: right;
            margin-top: 20px;
        }

        .modal-actions button {
            margin-left: 8px;
        }

        .confirm-text {
            font-size: 16px;
            color: #334155;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>Student Records</h1>

    <div class="container">

        <a href="#/add" class="btn btn-primary">+ Add Student</a>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>

    </div>

    <!-- Add/Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Student</h3>

            <input type="hidden" id="studentId">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="number" id="age" placeholder="Age" required>
            <input type="text" id="course" placeholder="Course Name" required>

            <div class="modal-actions">
                <button id="saveBtn" class="btn btn-success">Save</button>
                <button onclick="closeEditModal()" class="btn btn-primary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <p class="confirm-text">Are you sure you want to delete this student?</p>

            <div class="modal-actions">
                <button id="confirmDelete" class="btn btn-danger">Delete</button>
                <button onclick="closeDeleteModal()" class="btn btn-primary">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "students";
        let deleteId = null;

        /* --------------------- STORAGE -------------------- */
        function getStudents() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        }

        function saveStudents(students) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        }

        /* -------------------- RENDER TABLE -------------------- */
        function renderStudents() {
            const students = getStudents();
            const tbody = document.getElementById("studentTable");

            tbody.innerHTML = "";

            students.forEach(s => {
                tbody.innerHTML += `
                <tr>
                    <td>${s.name}</td>
                    <td>${s.email}</td>
                    <td>${s.age}</td>
                    <td>${s.course}</td>
                    <td>
                        <a href="#/edit/${s.id}" class="btn btn-success">Edit</a>
                        <a href="#/delete/${s.id}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>`;
            });
        }

        /* -------------------- ROUTER -------------------- */
        window.addEventListener("hashchange", router);
        window.addEventListener("load", router);

        function router() {
            const hash = location.hash;

            if (!hash || hash === "#/" || hash === "#") {
                closeEditModal();
                closeDeleteModal();
                renderStudents();
                return;
            }

            if (hash === "#/add") {
                openEditModal();
                return;
            }

            if (hash.startsWith("#/edit/")) {
                const id = Number(hash.split("/")[2]);
                openEditModal(id);
                return;
            }

            if (hash.startsWith("#/delete/")) {
                const id = Number(hash.split("/")[2]);
                openDeleteModal(id);
                return;
            }
        }

        /* -------------------- OPEN/CLOSE MODALS -------------------- */
        function openEditModal(id = null) {
            const modal = document.getElementById("editModal");
            modal.style.display = "block";

            if (id) {
                const s = getStudents().find(st => st.id === id);

                document.getElementById("modalTitle").innerText = "Edit Student";
                document.getElementById("studentId").value = s.id;
                document.getElementById("name").value = s.name;
                document.getElementById("email").value = s.email;
                document.getElementById("age").value = s.age;
                document.getElementById("course").value = s.course;
            } else {
                document.getElementById("modalTitle").innerText = "Add Student";
                document.getElementById("studentId").value = "";
                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("age").value = "";
                document.getElementById("course").value = "";
            }
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
            history.pushState("", "", "#/");
        }

        /* -------------------- SAVE STUDENT -------------------- */
        document.getElementById("saveBtn").onclick = function () {
            const id = document.getElementById("studentId").value;
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const age = document.getElementById("age").value.trim();
            const course = document.getElementById("course").value.trim();

            if (!name || !email || !age || !course) {
                alert("All fields are required!");
                return;
            }

            let students = getStudents();

            if (id) {
                students = students.map(s =>
                    s.id === Number(id) ? { id: Number(id), name, email, age, course } : s
                );
            } else {
                students.push({ id: Date.now(), name, email, age, course });
            }

            saveStudents(students);
            closeEditModal();
            renderStudents();
        };

        /* -------------------- DELETE STUDENT -------------------- */
        function openDeleteModal(id) {
            deleteId = id;
            document.getElementById("deleteModal").style.display = "block";
        }

        function closeDeleteModal() {
            deleteId = null;
            document.getElementById("deleteModal").style.display = "none";
            history.pushState("", "", "#/");
        }

        document.getElementById("confirmDelete").onclick = function () {
            let students = getStudents().filter(s => s.id !== deleteId);
            saveStudents(students);
            closeDeleteModal();
            renderStudents();
        };

        /* -------------------- CLOSE MODAL WHEN CLICK OUTSIDE -------------------- */
        window.onclick = function (e) {
            if (e.target === document.getElementById("editModal")) closeEditModal();
            if (e.target === document.getElementById("deleteModal")) closeDeleteModal();
        };

        renderStudents();
    </script>

</body>

</html>
